name: Approve bot runs

# Pushes made with GITHUB_TOKEN start PR runs in approval-required state.
# Approve them as soon as they appear, but only for the bot on this repo's own branches.
on:
    workflow_run:
        workflows:
            - Build
            - Unit Tests
            - Check Formatting
            - Web Components PR Validation
        types: [requested, completed]

permissions:
    actions: write

jobs:
    approve:
        if: >-
            github.event.workflow_run.conclusion == 'action_required' &&
            github.event.workflow_run.actor.login == 'github-actions[bot]' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/approve"
              env:
                  GH_TOKEN: ${{ github.token }}
