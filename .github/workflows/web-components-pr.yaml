name: Web Components PR Validation

on:
    pull_request:
        paths:
            - 'web-components/**'
        types: [opened, synchronize, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: Build and Test Web Components
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        defaults:
            run:
                working-directory: web-components
        strategy:
            matrix:
                node-version: [22.x]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.head_ref }}
                  # GITHUB_TOKEN pushes don't trigger workflows, so required checks never run on the bot commit.
                  token: ${{ secrets.DIST_BOT_TOKEN || github.token }}

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci
              working-directory: .

            - name: Run build
              run: npm run build

            - name: Commit build output
              if: github.event.pull_request.head.repo.full_name == github.repository
              run: |
                  git add -A dist docs
                  git diff --cached --quiet && exit 0
                  git config user.name mas-bot
                  git config user.email mas-bot@users.noreply.github.com
                  git commit -m "chore: build dist"
                  git push

            # Fork PRs get a read-only token, so they still have to commit the build themselves.
            - name: Check for uncommitted changes
              if: github.event.pull_request.head.repo.full_name != github.repository
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "❌ Build generated changes that are not committed:"
                    git status --porcelain
                    echo ""
                    echo "Please run 'npm run build' locally and commit the generated files."
                    exit 1
                  else
                    echo "✅ No uncommitted changes after build"
                  fi
